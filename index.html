<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ACC 289 — Cooper's Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0f1115;
    --card: #181c24;
    --card-2: #1f2531;
    --line: #2a3140;
    --text: #e7eaf0;
    --text-dim: #9aa3b2;
    --accent: #7c5cff;
    --accent-2: #a48bff;
    --good: #22c55e;
    --bad: #ef4444;
    --shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(124,92,255,.18), transparent 60%),
      radial-gradient(900px 500px at -10% 90%, rgba(124,92,255,.12), transparent 50%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--line);
    background: rgba(15,17,21,.7); backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 50;
  }
  .brand { display: flex; gap: 12px; align-items: center; }
  .brand .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-weight: 800; color: white;
    box-shadow: 0 8px 20px rgba(124,92,255,.4);
  }
  .brand .title { font-weight: 800; letter-spacing: -.01em; font-size: 16px; }
  .brand .sub { font-size: 12px; color: var(--text-dim); }
  .progress-mini {
    display: flex; gap: 6px; align-items: center; color: var(--text-dim); font-size: 12.5px;
  }
  .progress-mini .bar { width: 140px; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress-mini .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s ease; }

  .wrap { max-width: 980px; margin: 0 auto; padding: 36px 24px 80px; }

  /* Mode tabs */
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  .tab {
    background: var(--card); border: 1px solid var(--line); color: var(--text-dim);
    padding: 12px 18px; border-radius: 12px; font-weight: 700; font-size: 14px;
    cursor: pointer; transition: all .15s ease;
  }
  .tab:hover { background: var(--card-2); color: var(--text); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white; border-color: transparent; box-shadow: 0 8px 24px rgba(124,92,255,.4);
  }

  /* Stats strip */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px;
  }
  .stat .v { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .stat .k { font-size: 11px; color: var(--text-dim); margin-top: 4px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

  /* Filter */
  .filter {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .chip {
    background: var(--card); border: 1px solid var(--line); color: var(--text-dim);
    padding: 8px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; transition: all .15s ease;
  }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--accent); color: white; border-color: transparent; }

  /* Flashcard */
  .stage { perspective: 1200px; margin: 24px 0; min-height: 360px; }
  .card {
    position: relative; width: 100%; min-height: 360px;
    transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2,.7,.2,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 22px; padding: 36px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }
  .face.front {
    background: linear-gradient(160deg, var(--card) 0%, #202633 100%);
  }
  .face.front::before {
    content: ""; position: absolute; inset: 0; border-radius: 22px;
    background: radial-gradient(ellipse at 50% 0%, rgba(124,92,255,.18), transparent 60%);
    pointer-events: none;
  }
  .face.back {
    background: linear-gradient(160deg, #1a1f2c 0%, var(--card-2) 100%);
    transform: rotateY(180deg);
  }
  .face .tag {
    font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent-2); margin-bottom: 18px;
  }
  .face .term { font-size: 32px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
  .face .defn { font-size: 17px; line-height: 1.55; color: #d9dde6; max-width: 720px; }
  .face .hint { font-size: 11px; color: var(--text-dim); margin-top: 22px; }
  .face .tap { font-size: 12px; color: var(--text-dim); margin-top: auto; opacity: .75; }

  /* Controls */
  .controls {
    display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 10px;
    align-items: center; margin-top: 18px;
  }
  .btn {
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    padding: 12px 18px; border-radius: 12px; font-weight: 700; font-size: 14px;
    cursor: pointer; transition: all .15s ease;
  }
  .btn:hover { background: var(--card-2); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border-color: transparent; box-shadow: 0 8px 20px rgba(124,92,255,.35); }
  .btn.good { background: rgba(34,197,94,.15); color: #86efac; border-color: rgba(34,197,94,.4); }
  .btn.bad { background: rgba(239,68,68,.15); color: #fca5a5; border-color: rgba(239,68,68,.4); }
  .counter { text-align: center; color: var(--text-dim); font-size: 13px; font-weight: 700; }

  /* Test mode */
  .test {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 28px;
  }
  .test .q { font-size: 22px; font-weight: 700; line-height: 1.4; margin-bottom: 22px; }
  .option {
    width: 100%; text-align: left; padding: 14px 18px; border-radius: 12px;
    background: var(--card-2); border: 1px solid var(--line); color: var(--text);
    font-size: 15px; cursor: pointer; margin-bottom: 10px; transition: all .15s ease;
    display: flex; align-items: center; gap: 12px;
  }
  .option:hover { border-color: var(--accent); }
  .option .letter {
    width: 28px; height: 28px; border-radius: 8px; background: var(--line);
    display: grid; place-items: center; font-weight: 800; font-size: 12px;
    flex-shrink: 0;
  }
  .option.correct { background: rgba(34,197,94,.12); border-color: var(--good); color: #bbf7d0; }
  .option.correct .letter { background: var(--good); color: #052e16; }
  .option.wrong { background: rgba(239,68,68,.12); border-color: var(--bad); color: #fecaca; }
  .option.wrong .letter { background: var(--bad); color: #450a0a; }
  .test .feedback { margin-top: 16px; padding: 14px 18px; border-radius: 10px; font-size: 14px; }
  .test .feedback.good { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.4); color: #bbf7d0; }
  .test .feedback.bad { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.4); color: #fecaca; }

  /* Match mode */
  .match-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px;
  }
  .match-col h3 { font-size: 12px; color: var(--text-dim); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; font-weight: 800; }
  .match-cell {
    background: var(--card-2); border: 1px solid var(--line); padding: 12px 14px;
    border-radius: 10px; margin-bottom: 8px; font-size: 14px; cursor: pointer;
    transition: all .15s ease;
  }
  .match-cell:hover { border-color: var(--accent); }
  .match-cell.picked { background: var(--accent); color: white; border-color: transparent; }
  .match-cell.matched { background: rgba(34,197,94,.15); border-color: var(--good); color: #bbf7d0; cursor: default; }
  .match-cell.wrong { background: rgba(239,68,68,.15); border-color: var(--bad); color: #fecaca; }

  /* End screen */
  .end {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 40px; text-align: center;
  }
  .end .score { font-size: 56px; font-weight: 800; letter-spacing: -.02em; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .end .verdict { font-size: 18px; margin-top: 8px; color: var(--text-dim); }
  .end .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 24px 0; }
  .end .stats-row div { background: var(--card-2); padding: 14px; border-radius: 10px; }
  .end .stats-row .v { font-size: 20px; font-weight: 800; }
  .end .stats-row .k { font-size: 11px; color: var(--text-dim); margin-top: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .face { padding: 26px; }
    .face .term { font-size: 24px; }
    .face .defn { font-size: 15px; }
    .match-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">A</div>
    <div>
      <div class="title">ACC 289 — Cooper's Deck</div>
      <div class="sub">Financial Statements & Vocabulary · Chapters 1–2</div>
    </div>
  </div>
  <div class="progress-mini">
    <div id="scoreMini">0 / 0</div>
    <div class="bar"><div id="progressBar" style="width:0%"></div></div>
  </div>
</div>

<div class="wrap">

  <div class="tabs">
    <div class="tab active" data-mode="flash">Flashcards</div>
    <div class="tab" data-mode="test">Test</div>
    <div class="tab" data-mode="match">Match</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="v" id="statSeen">0</div><div class="k">Studied</div></div>
    <div class="stat"><div class="v" id="statCorrect">0</div><div class="k">Correct</div></div>
    <div class="stat"><div class="v" id="statStreak">0</div><div class="k">Best Streak</div></div>
    <div class="stat"><div class="v" id="statAcc">—</div><div class="k">Accuracy</div></div>
  </div>

  <div class="filter" id="filter"></div>

  <div id="view"></div>
</div>

<script>
/* ================== DECK ================== */
const DECK = [
  // === The four financial statements ===
  { term: "Income Statement", def: "Reports a company's revenues and expenses over a period of time, resulting in net income (or net loss).", tag: "statements" },
  { term: "Balance Sheet",     def: "Reports a company's assets, liabilities, and stockholders' equity at a specific point in time. Built on the equation: Assets = Liabilities + Equity.", tag: "statements" },
  { term: "Statement of Cash Flows", def: "Reports cash inflows and outflows during a period, organized into operating, investing, and financing activities.", tag: "statements" },
  { term: "Statement of Stockholders' Equity", def: "Reports changes in equity during a period — contributed capital, retained earnings, dividends, and net income.", tag: "statements" },

  // === Core vocabulary ===
  { term: "Assets",            def: "Resources owned by the company that have measurable value and are expected to produce future economic benefit.", tag: "vocab" },
  { term: "Liabilities",       def: "Obligations the company owes to others — debts and other future sacrifices of economic benefits.", tag: "vocab" },
  { term: "Stockholders' Equity", def: "The owners' residual claim on assets after liabilities are subtracted (Assets − Liabilities). Also called net assets or owners' equity.", tag: "vocab" },
  { term: "Revenue",           def: "The inflow of assets (or settlement of liabilities) from selling goods or services to customers. Recorded when earned, not when cash is collected.", tag: "vocab" },
  { term: "Expense",           def: "The outflow of assets (or incurrence of liabilities) used to generate revenue during a period.", tag: "vocab" },
  { term: "Net Income",        def: "The excess of revenues over expenses for a period. Bottom line of the income statement.", tag: "vocab" },
  { term: "Net Loss",          def: "The excess of expenses over revenues for a period.", tag: "vocab" },
  { term: "Dividends",         def: "Distributions of cash (or sometimes stock) from a corporation to its shareholders. Reduce retained earnings.", tag: "vocab" },
  { term: "Retained Earnings", def: "The cumulative net income of the company that has been kept (retained) in the business rather than paid out as dividends.", tag: "vocab" },
  { term: "GAAP",              def: "Generally Accepted Accounting Principles — the set of rules, standards, and procedures that govern corporate accounting in the United States.", tag: "vocab" },
  { term: "Accrual Basis",     def: "Method of accounting that records revenues when earned and expenses when incurred — regardless of when cash is exchanged. (Contrast with cash basis.)", tag: "vocab" },
  { term: "Cash Basis",        def: "Method of accounting that records revenues and expenses only when cash is received or paid. Most businesses do NOT use this.", tag: "vocab" },
  { term: "Fiscal Year",       def: "Any 12-month accounting period a company uses for reporting. Does not have to be Jan–Dec.", tag: "vocab" },
  { term: "Going Concern",     def: "The accounting assumption that a business will continue to operate indefinitely into the future.", tag: "vocab" },
  { term: "Monetary Unit",     def: "The accounting assumption that money is the unit of measurement and is stable over time.", tag: "vocab" },
  { term: "Historical Cost",   def: "The accounting principle that assets should be recorded at the cash-equivalent price paid to acquire them — NOT current market value.", tag: "vocab" },
  { term: "Full Disclosure",   def: "The accounting principle that financial reports should include all information necessary to understand a company's financial position.", tag: "vocab" },
  { term: "Materiality",       def: "The concept that financial information should be reported if omitting or misstating it could influence a decision-maker's judgment.", tag: "vocab" },
  { term: "Conservatism",      def: "The principle that when in doubt, accountants should choose the method that understates assets/income rather than overstates them.", tag: "vocab" },
  { term: "Matching Principle",def: "Revenues and the expenses incurred to generate those revenues should be recorded in the SAME period.", tag: "vocab" },
  { term: "Time Period",       def: "The accounting concept that the life of a business can be divided into artificial time periods (months, quarters, years) for reporting.", tag: "vocab" },
  { term: "Separate Entity",   def: "The accounting concept that a business's financial records are kept separate and distinct from its owner's personal finances.", tag: "vocab" },
  { term: "Debit",             def: "The left side of a T-account. Increases assets, expenses, and dividends. Decreases liabilities, equity, and revenue.", tag: "vocab" },
  { term: "Credit",            def: "The right side of a T-account. Increases liabilities, equity, and revenue. Decreases assets, expenses, and dividends.", tag: "vocab" },
  { term: "Chart of Accounts", def: "The complete list of account titles and numbers used by a company to record its transactions.", tag: "vocab" },
  { term: "General Journal",   def: "The book of original entry, where transactions are recorded in chronological order before posting to the ledger.", tag: "vocab" },
  { term: "General Ledger",    def: "The complete set of all accounts maintained by a company — the master summary of all transactions.", tag: "vocab" },
  { term: "Trial Balance",     def: "A list of all ledger account balances at a point in time, used to verify that total debits equal total credits.", tag: "vocab" },
];

/* ================== STATE ================== */
let mode = "flash";           // flash | test | match
let tagFilter = "all";
let idx = 0;
let flipped = false;
let seen = 0, correct = 0, streak = 0, bestStreak = 0;
let history = JSON.parse(localStorage.getItem("coop_acc289") || "{}");
if (history.correct) correct = history.correct;
if (history.bestStreak) bestStreak = history.bestStreak;
if (history.seen) seen = history.seen;
let testQ = null, testOpts = [], testAns = null;
let matchLeft = null, matchRight = null, matched = 0, matchWrongTimer = null;

const filtered = () => tagFilter === "all" ? DECK : DECK.filter(d => d.tag === tagFilter);

/* ================== INIT ================== */
document.addEventListener("DOMContentLoaded", () => {
  // tabs
  document.querySelectorAll(".tab").forEach(t => {
    t.onclick = () => {
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      mode = t.dataset.mode;
      idx = 0; flipped = false; matched = 0; matchLeft = null; matchRight = null;
      render();
    };
  });
  // filter chips
  const tags = ["all", "statements", "vocab"];
  const labels = { all: "All Cards", statements: "Financial Statements", vocab: "Vocabulary" };
  document.getElementById("filter").innerHTML = tags.map(t =>
    `<div class="chip ${t === tagFilter ? "active" : ""}" data-tag="${t}">${labels[t]}</div>`
  ).join("");
  document.querySelectorAll(".chip").forEach(c => {
    c.onclick = () => { tagFilter = c.dataset.tag; idx = 0; flipped = false; render(); };
  });
  render();
});

function save() {
  localStorage.setItem("coop_acc289", JSON.stringify({ seen, correct, bestStreak }));
}
function updateStats() {
  document.getElementById("statSeen").textContent = seen;
  document.getElementById("statCorrect").textContent = correct;
  document.getElementById("statStreak").textContent = bestStreak;
  const acc = seen ? Math.round((correct / seen) * 100) + "%" : "—";
  document.getElementById("statAcc").textContent = acc;
  document.getElementById("scoreMini").textContent = `${correct} / ${seen}`;
  const pct = seen ? Math.min(100, (correct / Math.max(DECK.length, 1)) * 100) : 0;
  document.getElementById("progressBar").style.width = pct + "%";
}

/* ================== RENDER ================== */
function render() {
  // refresh chips active state
  document.querySelectorAll(".chip").forEach(c => {
    c.classList.toggle("active", c.dataset.tag === tagFilter);
  });
  updateStats();
  const view = document.getElementById("view");
  if (mode === "flash") view.innerHTML = renderFlash();
  else if (mode === "test") { if (!testQ) prepTest(); view.innerHTML = renderTest(); }
  else if (mode === "match") view.innerHTML = renderMatch();
}

/* ---- Flashcards ---- */
function renderFlash() {
  const cards = filtered();
  if (!cards.length) return "<div class='end'><div class='verdict'>No cards in this category.</div></div>";
  const c = cards[idx % cards.length];
  return `
    <div class="stage" id="stage">
      <div class="card ${flipped ? "flipped" : ""}" id="card">
        <div class="face front">
          <div class="tag">${c.tag === "statements" ? "Financial Statement" : "Vocabulary"} · tap to flip</div>
          <div class="term">${c.term}</div>
          <div class="tap">Showing term · click card to reveal definition</div>
        </div>
        <div class="face back">
          <div class="tag">Definition</div>
          <div class="defn">${c.def}</div>
          <div class="tap">click card to flip back</div>
        </div>
      </div>
    </div>
    <div class="controls">
      <div></div>
      <div></div>
      <div class="counter">${idx + 1} / ${cards.length}</div>
      <button class="btn bad" id="didnt">Didn't know</button>
      <button class="btn good" id="knew">Knew it ✓</button>
    </div>`;
}
document.addEventListener("click", e => {
  if (e.target.closest("#card") && document.getElementById("card")) {
    flipped = !flipped;
    document.getElementById("card").classList.toggle("flipped", flipped);
  }
  if (e.target.closest("#knew")) {
    seen++; correct++; streak++; bestStreak = Math.max(bestStreak, streak);
    save(); flipped = false; idx++; render();
  }
  if (e.target.closest("#didnt")) {
    seen++; streak = 0;
    save(); flipped = false; idx++; render();
  }
});

/* ---- Test ---- */
function prepTest() {
  const cards = filtered();
  if (cards.length < 2) { testQ = null; return; }
  testQ = cards[Math.floor(Math.random() * cards.length)];
  let distractors = cards.filter(c => c.term !== testQ.term);
  shuffle(distractors);
  testOpts = [testQ, distractors[0], distractors[1], distractors[2]].slice(0, 4);
  shuffle(testOpts);
  testAns = null;
}
function renderTest() {
  if (!testQ) return "<div class='end'><div class='verdict'>Need at least 4 cards to start a test.</div></div>";
  const letters = ["A", "B", "C", "D"];
  return `
    <div class="test">
      <div class="tag" style="font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2);margin-bottom:8px;">Match the term</div>
      <div class="q">${testQ.term}</div>
      ${testOpts.map((o, i) => `
        <button class="option ${testAns === 'x' && o.term === testQ.term ? 'correct' : ''} ${testAns === 'wrong' && o === wrongOne ? 'wrong' : ''}" data-i="${i}" ${testAns ? "disabled" : ""}>
          <span class="letter">${letters[i]}</span><span>${o.def}</span>
        </button>
      `).join("")}
      ${testAns === "x" ? `<div class="feedback good">✓ Correct! That's the definition of <b>${testQ.term}</b>.</div>`
        : testAns === "wrong" ? `<div class="feedback bad">✗ Not quite. The correct answer was A/B/C/D — <b>${testQ.term}: ${testQ.def}</b></div>`
        : ""}
      ${testAns ? `<button class="btn primary" id="nextQ" style="margin-top:18px;">Next question →</button>` : ""}
    </div>`;
}
let wrongOne = null;
document.addEventListener("click", e => {
  if (e.target.closest(".option") && testQ && !testAns) {
    const i = parseInt(e.target.closest(".option").dataset.i);
    const pick = testOpts[i];
    testAns = (pick.term === testQ.term) ? "x" : "wrong";
    wrongOne = pick;
    seen++;
    if (testAns === "x") { correct++; streak++; bestStreak = Math.max(bestStreak, streak); }
    else streak = 0;
    save(); render();
  }
  if (e.target.closest("#nextQ")) { prepTest(); render(); }
});

/* ---- Match ---- */
function renderMatch() {
  const cards = filtered().slice(0, 8);
  if (cards.length < 4) return "<div class='end'><div class='verdict'>Need at least 4 cards to play match.</div></div>";
  if (matched === cards.length) {
    return `
      <div class="end">
        <div class="score">Cleared!</div>
        <div class="verdict">You matched all ${cards.length} pairs.</div>
        <div class="stats-row">
          <div><div class="v">${matched}</div><div class="k">Matched</div></div>
          <div><div class="v">${bestStreak}</div><div class="k">Best Streak</div></div>
          <div><div class="v">${correct}</div><div class="k">All-Time Correct</div></div>
        </div>
        <button class="btn primary" id="resetMatch">Play again</button>
      </div>`;
  }
  const left = [...cards].map(c => c.term);
  const right = [...cards].map(c => c.def).sort(() => Math.random() - 0.5);
  return `
    <div style="margin-bottom:14px;color:var(--text-dim);font-size:13px;font-weight:700;">Tap a term, then its matching definition. Match all pairs to clear the round.</div>
    <div class="match-grid">
      <div class="match-col"><h3>Terms</h3>${left.map((t, i) =>
        `<div class="match-cell ${matchLeft === t ? "picked" : ""} ${matchedPairTerm === t ? "matched" : ""}" data-side="L" data-term="${t.replace(/"/g,'&quot;')}">${t}</div>`
      ).join("")}</div>
      <div class="match-col"><h3>Definitions</h3>${right.map(d => {
        const matchCard = cards.find(c => c.def === d);
        return `<div class="match-cell ${matchRight === d ? "picked" : ""} ${matchedPairDef === d ? "matched" : ""}" data-side="R" data-def="${d.replace(/"/g,'&quot;')}">${d}</div>`;
      }).join("")}</div>
    </div>`;
}
let matchedPairTerm = null, matchedPairDef = null;
document.addEventListener("click", e => {
  const cell = e.target.closest(".match-cell");
  if (!cell || cell.classList.contains("matched")) return;
  if (cell.dataset.side === "L") { matchLeft = cell.dataset.term; render(); return; }
  if (cell.dataset.side === "R" && matchLeft) {
    matchRight = cell.dataset.def;
    const card = filtered().slice(0, 8).find(c => c.def === matchRight && c.term === matchLeft);
    seen++;
    if (card) {
      correct++; streak++; bestStreak = Math.max(bestStreak, streak);
      matched++; matchedPairTerm = matchLeft; matchedPairDef = matchRight;
      save();
      setTimeout(() => { matchLeft = null; matchRight = null; matchedPairTerm = null; matchedPairDef = null; render(); }, 350);
    } else {
      streak = 0; save();
      cell.classList.add("wrong");
      setTimeout(() => { matchLeft = null; matchRight = null; render(); }, 700);
    }
  }
  if (e.target.closest("#resetMatch")) { matched = 0; render(); }
});

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}
</script>
